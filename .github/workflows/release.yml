# Release: Windows (MSI + NSIS), Linux (AppImage + .deb), Android (APK + AAB).
#
# Tags drive releases: push `v0.2.0` and all four platform jobs build in
# parallel, then attach to one GitHub Release. Desktop builds sign an
# updater bundle with TAURI_SIGNING_PRIVATE_KEY (see docs/release.md).
#
# Android needs two secrets: ANDROID_KEYSTORE_BASE64 (the .jks, base64) plus
# ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD / ANDROID_STORE_PASSWORD.
# The keystore itself is NEVER committed.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: "--bundles msi,nsis"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Roundtable ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Android SDK + NDK
        id: sdk
        uses: android-actions/setup-android@v3
      - name: Install NDK
        id: ndk
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ndk-path=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Restore keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
      - name: Build release APK + AAB
        # gen/android must be committed (run `npx tauri android init` once).
        # Signing config comes from CI-written keystore.properties — see
        # android/app/build.gradle + docs/release.md. Never commit keys.
        run: |
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=/tmp/release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          npx tauri android build
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: Sign APK
        run: |
          ls src-tauri/gen/android/app/build/outputs/apk/universal/release/
          ls src-tauri/gen/android/app/build/outputs/bundle/universalRelease/
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
      - name: Scrub keystore
        if: always()
        run: shred -u /tmp/release.jks || rm -f /tmp/release.jks
