[package]
name = "roundtable"
version = "0.1.0"
description = "Chat with AI models and run role-based agents that talk to each other"
authors = ["Roundtable contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "roundtable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
roundtable-core = { path = "../crates/roundtable-core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
keyring = "4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.8.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-updater = "2.13.3"

# Android Keystore backend for the same keyring API secrets.rs already uses.
[target.'cfg(target_os = "android")'.dependencies.keyring]
version = "4"
features = ["android-native-keyring-store"]
